        if(loaded) return; loaded = true;
        // preconnect just-in-time
        try {
          var pc = document.createElement('link');
          pc.rel = 'preconnect'; pc.href = 'https://www.googletagmanager.com'; pc.crossOrigin = 'anonymous';
          document.head.appendChild(pc);
        } catch(_){}
        var s = document.createElement('script');
        s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;

        window.gtag = function(){ window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', GA_ID, { send_page_view: false });
      }
      function once(){ loadGA(); remove(); }
      function remove(){ events.forEach(function(e){ window.removeEventListener(e, once, { passive: true }); }); }
      var events = ['scroll','click','pointerdown','keydown','touchstart','visibilitychange'];
      events.forEach(function(e){ window.addEventListener(e, once, { passive: true, once: true }); });
      if('requestIdleCallback' in window){
        requestIdleCallback(function(){ loadGA(); }, { timeout: 5000 });
      } else {
        window.addEventListener('load', function(){ setTimeout(loadGA, 3000); });
